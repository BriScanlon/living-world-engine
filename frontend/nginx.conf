server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-sent events (live forecast progress)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Map label glyphs: a range we don't ship must be a 404, not the app's index.html
    location /fonts/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
    }
}
