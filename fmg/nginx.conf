server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Upstream's headers (.docker/default.conf) plus 'unsafe-eval' (its "goods" step evaluates generated code):
        # nothing loads from, or reports to, anywhere else
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src data: 'self'; connect-src 'self' data: blob:; worker-src 'self' blob:";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin";
    }
}
