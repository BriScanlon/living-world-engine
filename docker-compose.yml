name: living-world-engine

services:
  terminusdb:
    image: terminusdb/terminusdb-server:v11.1.14
    environment:
      TERMINUSDB_ADMIN_PASS: ${TERMINUSDB_ADMIN_PASS:-root}
      TERMINUSDB_SERVER_PORT: 6363
    ports:
      - "127.0.0.1:${TERMINUSDB_PORT:-6363}:6363"  # localhost only: no auth beyond the admin password
    volumes:
      - terminusdb_data:/app/terminusdb/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6363 && printf 'GET /api/ok HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
        INSTALL_WHISPER: ${INSTALL_WHISPER:-false}
    env_file:
      - path: .env
        required: false
    environment:
      TERMINUSDB_URL: http://terminusdb:6363/
      TERMINUSDB_PASS: ${TERMINUSDB_ADMIN_PASS:-root}
      # The virtual tabletop, reached over the compose network
      VTT_URL: http://vtt:8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      terminusdb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Virtual tabletop: /table on the 4K table display, /dm on the DM's laptop or tablet
  vtt:
    build:
      context: ./vtt
    environment:
      DATA_DIR: /data
      MOCK_AI_PIPELINE: ${VTT_MOCK_AI_PIPELINE:-true}
      LLM_API_URL: ${VTT_LLM_API_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${VTT_LLM_API_KEY:-ollama}
      LLM_MODEL: ${VTT_LLM_MODEL:-qwen2.5:14b-instruct}
      LLM_VISION_MODEL: ${VTT_LLM_VISION_MODEL:-qwen2.5vl:7b}
      COMFY_IMAGE_URL: ${VTT_COMFY_IMAGE_URL:-http://host.docker.internal:8188}
      COMFY_VIDEO_URL: ${VTT_COMFY_VIDEO_URL:-http://host.docker.internal:8188}
      COMFY_IMAGE_WORKFLOW: ${VTT_COMFY_IMAGE_WORKFLOW:-flux_battlemap.json}
      COMFY_VIDEO_WORKFLOW: ${VTT_COMFY_VIDEO_WORKFLOW:-wan21_flf2v_loop.json}
      COMFY_TIMEOUT_S: ${VTT_COMFY_TIMEOUT_S:-1800}
      WATCH_INBOX: ${VTT_WATCH_INBOX:-true}
      INBOX_POLLING: ${VTT_INBOX_POLLING:-true}
      DEFAULT_HEX_PX: ${VTT_DEFAULT_HEX_PX:-91.8}
    ports:
      - "${VTT_PORT:-8080}:8000"
    volumes:
      - vtt_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  terminusdb_data:
  backend_data:
  vtt_data:
