services:
  vtt:
    build: .
    image: local-ai-vtt:latest
    container_name: local-ai-vtt
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "${VTT_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      # Lets the container reach Ollama / ComfyUI running on the Docker host.
      # For a separate GPU box just put its LAN IP in .env instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
